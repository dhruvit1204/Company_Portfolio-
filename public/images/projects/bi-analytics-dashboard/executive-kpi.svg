<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <defs>
    <linearGradient id="biBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071426"/>
      <stop offset="50%" stop-color="#0b1e38"/>
      <stop offset="100%" stop-color="#08172c"/>
    </linearGradient>
    <linearGradient id="chartLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="areaFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="800" fill="url(#biBg)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1000" height="64" fill="#09182d"/>
  <line x1="0" y1="64" x2="1000" y2="64" stroke="#172e4b" stroke-width="1"/>
  <circle cx="36" cy="32" r="14" fill="#38bdf8" fill-opacity="0.2"/>
  <path d="M28 36 L34 26 L40 32 L46 24" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <text x="60" y="38" fill="#ffffff" font-family="system-ui" font-size="16" font-weight="700">OMNIMETRICS EXECUTIVE SUITE</text>
  <rect x="680" y="20" width="280" height="26" rx="13" fill="#142c4b" stroke="#1f3f6b" stroke-width="1"/>
  <text x="700" y="38" fill="#94a3b8" font-family="monospace" font-size="11">DATE RANGE: Q1-Q4 FY2025 • LIVE</text>

  <!-- KPI Row -->
  <g transform="translate(40, 85)">
    <!-- ARR -->
    <rect x="0" y="0" width="210" height="95" rx="10" fill="#0d203a" stroke="#19365c" stroke-width="1"/>
    <text x="20" y="30" fill="#94a3b8" font-family="system-ui" font-size="11" font-weight="600">ANNUAL RECURRING REVENUE (ARR)</text>
    <text x="20" y="65" fill="#ffffff" font-family="monospace" font-size="28" font-weight="800">$18.42M</text>
    <text x="20" y="85" fill="#34d399" font-family="monospace" font-size="11">▲ +34.8% YoY</text>

    <!-- NRR -->
    <rect x="235" y="0" width="210" height="95" rx="10" fill="#0d203a" stroke="#19365c" stroke-width="1"/>
    <text x="255" y="30" fill="#94a3b8" font-family="system-ui" font-size="11" font-weight="600">NET RETENTION RATE (NDR)</text>
    <text x="255" y="65" fill="#38bdf8" font-family="monospace" font-size="28" font-weight="800">124.6%</text>
    <text x="255" y="85" fill="#38bdf8" font-family="monospace" font-size="11">Top Decile SaaS</text>

    <!-- CAC Payback -->
    <rect x="470" y="0" width="210" height="95" rx="10" fill="#0d203a" stroke="#19365c" stroke-width="1"/>
    <text x="490" y="30" fill="#94a3b8" font-family="system-ui" font-size="11" font-weight="600">CAC PAYBACK PERIOD</text>
    <text x="490" y="65" fill="#f59e0b" font-family="monospace" font-size="28" font-weight="800">7.2 Mos</text>
    <text x="490" y="85" fill="#34d399" font-family="monospace" font-size="11">▼ -2.1 Mos vs 2024</text>

    <!-- Gross Margin -->
    <rect x="705" y="0" width="215" height="95" rx="10" fill="#0d203a" stroke="#19365c" stroke-width="1"/>
    <text x="725" y="30" fill="#94a3b8" font-family="system-ui" font-size="11" font-weight="600">SUBSCRIPTION GROSS MARGIN</text>
    <text x="725" y="65" fill="#a78bfa" font-family="monospace" font-size="28" font-weight="800">82.4%</text>
    <text x="725" y="85" fill="#34d399" font-family="monospace" font-size="11">High Operating Leverage</text>
  </g>

  <!-- Big Interactive Chart Card -->
  <g transform="translate(40, 205)">
    <rect x="0" y="0" width="920" height="555" rx="14" fill="#0d203a" stroke="#19365c" stroke-width="1"/>
    
    <text x="30" y="40" fill="#ffffff" font-family="system-ui" font-size="18" font-weight="700">Multi-Series ARR Growth vs Churn Horizon</text>
    <text x="30" y="65" fill="#94a3b8" font-family="system-ui" font-size="12">Rendered across 150,000 telemetry points using WebGL chart workers (sub-180ms compute)</text>

    <!-- Legend -->
    <circle cx="700" cy="40" r="5" fill="#38bdf8"/>
    <text x="712" y="44" fill="#cbd5e1" font-family="system-ui" font-size="11">Gross ARR</text>
    <circle cx="800" cy="40" r="5" fill="#f43f5e"/>
    <text x="812" y="44" fill="#cbd5e1" font-family="system-ui" font-size="11">Gross Churn</text>

    <!-- Chart Grid Lines -->
    <g stroke="#172b47" stroke-width="1">
      <line x1="60" y1="120" x2="880" y2="120"/>
      <line x1="60" y1="200" x2="880" y2="200"/>
      <line x1="60" y1="280" x2="880" y2="280"/>
      <line x1="60" y1="360" x2="880" y2="360"/>
      <line x1="60" y1="440" x2="880" y2="440"/>
    </g>

    <!-- Y-Axis Labels -->
    <g fill="#64748b" font-family="monospace" font-size="11" text-anchor="end">
      <text x="50" y="125">$20M</text>
      <text x="50" y="205">$15M</text>
      <text x="50" y="285">$10M</text>
      <text x="50" y="365">$5M</text>
      <text x="50" y="445">$0M</text>
    </g>

    <!-- Area polygon under ARR curve -->
    <path d="M 60 410 Q 180 380 260 340 T 460 270 T 660 190 T 880 130 L 880 440 L 60 440 Z" fill="url(#areaFill)"/>

    <!-- ARR Line Curve -->
    <path d="M 60 410 Q 180 380 260 340 T 460 270 T 660 190 T 880 130" fill="none" stroke="url(#chartLine)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Churn Curve -->
    <path d="M 60 435 Q 200 430 350 425 T 600 420 T 880 415" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,4"/>

    <!-- Data points -->
    <circle cx="260" cy="340" r="5" fill="#38bdf8" stroke="#ffffff" stroke-width="2"/>
    <circle cx="460" cy="270" r="5" fill="#818cf8" stroke="#ffffff" stroke-width="2"/>
    <circle cx="660" cy="190" r="5" fill="#c084fc" stroke="#ffffff" stroke-width="2"/>
    <circle cx="880" cy="130" r="6" fill="#34d399" stroke="#ffffff" stroke-width="2"/>

    <!-- Tooltip Box on peak point -->
    <g transform="translate(620, 90)">
      <rect x="0" y="0" width="140" height="60" rx="8" fill="#081424" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="14" y="22" fill="#38bdf8" font-family="monospace" font-size="10">Q3 FY2025</text>
      <text x="14" y="42" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="700">$18,420,500</text>
      <text x="14" y="54" fill="#34d399" font-family="monospace" font-size="9">NDR: 124.6%</text>
    </g>

    <!-- X-Axis Labels -->
    <g fill="#64748b" font-family="monospace" font-size="11" text-anchor="middle">
      <text x="60" y="475">JAN</text>
      <text x="160" y="475">MAR</text>
      <text x="260" y="475">MAY</text>
      <text x="360" y="475">JUL</text>
      <text x="460" y="475">SEP</text>
      <text x="560" y="475">NOV</text>
      <text x="660" y="475">JAN '25</text>
      <text x="760" y="475">MAR '25</text>
      <text x="880" y="475">TODAY</text>
    </g>

    <!-- Bottom summary bar -->
    <rect x="30" y="495" width="860" height="42" rx="6" fill="#081525"/>
    <text x="50" y="521" fill="#38bdf8" font-family="monospace" font-size="12">Query Engine: Materialized PostgreSQL Views (172ms)</text>
    <text x="650" y="521" fill="#34d399" font-family="monospace" font-size="12">✓ Zero Frame Drops at 120Hz</text>
  </g>
</svg>