<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <defs>
    <linearGradient id="mobBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1526"/>
      <stop offset="100%" stop-color="#0e1f38"/>
    </linearGradient>
    <linearGradient id="redCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="800" fill="url(#mobBg)"/>

  <!-- Left: Mobile Phone Mockup -->
  <g transform="translate(140, 40)">
    <rect x="0" y="0" width="340" height="720" rx="36" fill="#050d1a" stroke="#1e3452" stroke-width="3"/>
    <!-- Phone Screen -->
    <rect x="12" y="16" width="316" height="688" rx="26" fill="#0a1728"/>
    
    <!-- Phone Top Status -->
    <text x="36" y="44" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="600">9:41</text>
    <circle cx="280" cy="40" r="3" fill="#ffffff"/>
    <circle cx="288" cy="40" r="3" fill="#ffffff"/>
    <rect x="296" y="35" width="16" height="9" rx="2" fill="#ffffff"/>

    <!-- App Header -->
    <text x="36" y="90" fill="#94a3b8" font-family="system-ui" font-size="12">Welcome back,</text>
    <text x="36" y="115" fill="#ffffff" font-family="system-ui" font-size="18" font-weight="700">Sarah Jenkins</text>

    <!-- Digital Donor ID Card -->
    <g transform="translate(24, 135)">
      <rect x="0" y="0" width="268" height="160" rx="16" fill="url(#redCard)"/>
      <text x="20" y="32" fill="#fecaca" font-family="system-ui" font-size="11" font-weight="600">VITALPULSE DONOR PASS</text>
      <text x="195" y="36" fill="#ffffff" font-family="monospace" font-size="18" font-weight="800">O+</text>
      <text x="20" y="85" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="700">SARAH JENKINS</text>
      <text x="20" y="105" fill="#fecaca" font-family="monospace" font-size="10">ID: VP-8902-NY</text>
      <rect x="20" y="125" width="90" height="20" rx="10" fill="#ffffff" fill-opacity="0.2"/>
      <text x="28" y="139" fill="#ffffff" font-family="system-ui" font-size="9" font-weight="700">ELIGIBLE TODAY</text>
      <!-- QR code mini mock -->
      <rect x="210" y="105" width="38" height="38" rx="4" fill="#ffffff"/>
      <rect x="216" y="111" width="10" height="10" fill="#000000"/>
      <rect x="232" y="111" width="10" height="10" fill="#000000"/>
      <rect x="216" y="127" width="10" height="10" fill="#000000"/>
    </g>

    <!-- Donation Impact -->
    <g transform="translate(24, 315)">
      <rect x="0" y="0" width="268" height="100" rx="12" fill="#10233b"/>
      <text x="20" y="30" fill="#94a3b8" font-family="system-ui" font-size="11">LIFETIME DONATIONS</text>
      <text x="20" y="65" fill="#38bdf8" font-family="monospace" font-size="28" font-weight="800">12 Units</text>
      <text x="120" y="60" fill="#34d399" font-family="system-ui" font-size="11" font-weight="600">36 Lives Saved</text>
    </g>

    <!-- Emergency SOS Alert Push -->
    <g transform="translate(24, 435)">
      <rect x="0" y="0" width="268" height="120" rx="12" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444" stroke-width="1.5"/>
      <text x="18" y="28" fill="#f87171" font-family="system-ui" font-size="12" font-weight="700">🚨 EMERGENCY REQUEST NEARBY</text>
      <text x="18" y="50" fill="#ffffff" font-family="system-ui" font-size="11">Memorial Hospital (2.8 km away)</text>
      <text x="18" y="68" fill="#cbd5e1" font-family="system-ui" font-size="10">Urgent need for O+ units in Trauma ICU</text>
      <rect x="18" y="80" width="232" height="30" rx="6" fill="#ef4444"/>
      <text x="75" y="100" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="700">ACCEPT & NAVIGATE</text>
    </g>
  </g>

  <!-- Right: Architecture & Companion Features -->
  <g transform="translate(530, 90)">
    <rect x="0" y="0" width="410" height="620" rx="16" fill="#0f2139" stroke="#1c375c" stroke-width="1"/>
    <text x="30" y="44" fill="#ffffff" font-family="system-ui" font-size="18" font-weight="700">Mobile Donor App Experience</text>

    <!-- Feature 1 -->
    <g transform="translate(30, 80)">
      <circle cx="16" cy="16" r="16" fill="#ef4444" fill-opacity="0.2"/>
      <text x="12" y="21" fill="#ef4444" font-family="system-ui" font-size="14" font-weight="700">1</text>
      <text x="48" y="16" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="700">Real-Time Geolocation SOS</text>
      <text x="48" y="36" fill="#94a3b8" font-family="system-ui" font-size="12">Instant push alerts dispatched to eligible donors within a 15km perimeter.</text>
    </g>

    <!-- Feature 2 -->
    <g transform="translate(30, 160)">
      <circle cx="16" cy="16" r="16" fill="#38bdf8" fill-opacity="0.2"/>
      <text x="12" y="21" fill="#38bdf8" font-family="system-ui" font-size="14" font-weight="700">2</text>
      <text x="48" y="16" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="700">90-Day Cooldown Safety Gate</text>
      <text x="48" y="36" fill="#94a3b8" font-family="system-ui" font-size="12">Enforces medical whole-blood recovery periods with eligibility countdown timers.</text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(30, 240)">
      <circle cx="16" cy="16" r="16" fill="#10b981" fill-opacity="0.2"/>
      <text x="12" y="21" fill="#10b981" font-family="system-ui" font-size="14" font-weight="700">3</text>
      <text x="48" y="16" fill="#ffffff" font-family="system-ui" font-size="14" font-weight="700">Contactless QR Code Intake</text>
      <text x="48" y="36" fill="#94a3b8" font-family="system-ui" font-size="12">Blood banks scan donor passes to auto-populate medical records in 4 seconds.</text>
    </g>

    <!-- Offline SQLite Sync -->
    <rect x="30" y="340" width="350" height="120" rx="10" fill="#091526" stroke="#162942" stroke-width="1"/>
    <text x="50" y="375" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700">OFFLINE-FIRST SQLITE ENGINE</text>
    <text x="50" y="405" fill="#94a3b8" font-family="system-ui" font-size="12">Guarantees ambulance crews and rural clinic staff have uninterrupted access even when mobile cellular connectivity drops.</text>
  </g>
</svg>