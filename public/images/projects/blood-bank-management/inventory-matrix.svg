<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <defs>
    <linearGradient id="bbBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a172a"/>
      <stop offset="50%" stop-color="#121e33"/>
      <stop offset="100%" stop-color="#091322"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="800" fill="url(#bbBg)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1000" height="64" fill="#0c182c"/>
  <line x1="0" y1="64" x2="1000" y2="64" stroke="#1c304d" stroke-width="1"/>
  <circle cx="36" cy="32" r="14" fill="#ef4444" fill-opacity="0.2"/>
  <circle cx="36" cy="32" r="6" fill="#ef4444"/>
  <text x="60" y="38" fill="#ffffff" font-family="system-ui" font-size="16" font-weight="700">VITALPULSE COLD-CHAIN & INVENTORY MATRIX</text>
  <rect x="730" y="20" width="230" height="26" rx="13" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="745" y="38" fill="#34d399" font-family="monospace" font-size="11">COLD STORAGE: 3.8°C NOMINAL</text>

  <!-- Blood Type Grid -->
  <g transform="translate(40, 90)">
    <text x="0" y="0" fill="#94a3b8" font-family="system-ui" font-size="13" font-weight="600">REGIONAL BLOOD GROUP RESERVES (WHOLE BLOOD & PACKED RBC)</text>
    
    <!-- O Negative (Critical) -->
    <g transform="translate(0, 15)">
      <rect x="0" y="0" width="210" height="130" rx="10" fill="#13233c" stroke="#ef4444" stroke-width="1.5"/>
      <text x="20" y="35" fill="#f87171" font-family="system-ui" font-size="24" font-weight="800">O NEGATIVE</text>
      <text x="145" y="35" fill="#ef4444" font-family="monospace" font-size="11" font-weight="700">CRITICAL</text>
      <text x="20" y="75" fill="#ffffff" font-family="monospace" font-size="32" font-weight="800">18 Units</text>
      <rect x="20" y="95" width="170" height="8" rx="4" fill="#334155"/>
      <rect x="20" y="95" width="40" height="8" rx="4" fill="#ef4444"/>
      <text x="20" y="118" fill="#94a3b8" font-family="system-ui" font-size="10">Target: 80 Units | Reorder sent</text>
    </g>

    <!-- O Positive (Optimal) -->
    <g transform="translate(235, 15)">
      <rect x="0" y="0" width="210" height="130" rx="10" fill="#13233c" stroke="#10b981" stroke-width="1"/>
      <text x="20" y="35" fill="#34d399" font-family="system-ui" font-size="24" font-weight="800">O POSITIVE</text>
      <text x="145" y="35" fill="#10b981" font-family="monospace" font-size="11" font-weight="700">OPTIMAL</text>
      <text x="20" y="75" fill="#ffffff" font-family="monospace" font-size="32" font-weight="800">142 Units</text>
      <rect x="20" y="95" width="170" height="8" rx="4" fill="#334155"/>
      <rect x="20" y="95" width="150" height="8" rx="4" fill="#10b981"/>
      <text x="20" y="118" fill="#94a3b8" font-family="system-ui" font-size="10">Capacity: 95% | Stable</text>
    </g>

    <!-- A Positive -->
    <g transform="translate(470, 15)">
      <rect x="0" y="0" width="210" height="130" rx="10" fill="#13233c" stroke="#38bdf8" stroke-width="1"/>
      <text x="20" y="35" fill="#38bdf8" font-family="system-ui" font-size="24" font-weight="800">A POSITIVE</text>
      <text x="150" y="35" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="700">STABLE</text>
      <text x="20" y="75" fill="#ffffff" font-family="monospace" font-size="32" font-weight="800">96 Units</text>
      <rect x="20" y="95" width="170" height="8" rx="4" fill="#334155"/>
      <rect x="20" y="95" width="110" height="8" rx="4" fill="#38bdf8"/>
      <text x="20" y="118" fill="#94a3b8" font-family="system-ui" font-size="10">Capacity: 75% | Normal</text>
    </g>

    <!-- B Negative -->
    <g transform="translate(705, 15)">
      <rect x="0" y="0" width="215" height="130" rx="10" fill="#13233c" stroke="#f59e0b" stroke-width="1"/>
      <text x="20" y="35" fill="#fbbf24" font-family="system-ui" font-size="24" font-weight="800">B NEGATIVE</text>
      <text x="155" y="35" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="700">LOW</text>
      <text x="20" y="75" fill="#ffffff" font-family="monospace" font-size="32" font-weight="800">32 Units</text>
      <rect x="20" y="95" width="170" height="8" rx="4" fill="#334155"/>
      <rect x="20" y="95" width="60" height="8" rx="4" fill="#f59e0b"/>
      <text x="20" y="118" fill="#94a3b8" font-family="system-ui" font-size="10">Capacity: 35% | Broadcast active</text>
    </g>
  </g>

  <!-- Component Breakdown & Cold-Chain Sensors -->
  <g transform="translate(40, 260)">
    <!-- Platelets / Plasma Breakdown -->
    <rect x="0" y="0" width="550" height="490" rx="12" fill="#102035" stroke="#1b3456" stroke-width="1"/>
    <text x="24" y="38" fill="#ffffff" font-family="system-ui" font-size="16" font-weight="700">Blood Component Processing Ledger</text>
    
    <g transform="translate(24, 60)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="502" height="85" rx="8" fill="#091524" stroke="#162942" stroke-width="1"/>
      <text x="20" y="30" fill="#f87171" font-family="system-ui" font-size="14" font-weight="700">Platelets (Apheresis Units)</text>
      <text x="20" y="50" fill="#94a3b8" font-family="system-ui" font-size="11">Storage Temp: 22.0°C (Agitator Running) • 5-day shelf life</text>
      <text x="400" y="45" fill="#ffffff" font-family="monospace" font-size="20" font-weight="800">48 Units</text>

      <!-- Row 2 -->
      <rect x="0" y="100" width="502" height="85" rx="8" fill="#091524" stroke="#162942" stroke-width="1"/>
      <text x="20" y="130" fill="#38bdf8" font-family="system-ui" font-size="14" font-weight="700">Fresh Frozen Plasma (FFP)</text>
      <text x="20" y="150" fill="#94a3b8" font-family="system-ui" font-size="11">Deep Freeze: -28.5°C • 1-year shelf life</text>
      <text x="390" y="145" fill="#ffffff" font-family="monospace" font-size="20" font-weight="800">210 Units</text>

      <!-- Row 3 -->
      <rect x="0" y="200" width="502" height="85" rx="8" fill="#091524" stroke="#162942" stroke-width="1"/>
      <text x="20" y="230" fill="#a78bfa" font-family="system-ui" font-size="14" font-weight="700">Cryoprecipitate Pooled Units</text>
      <text x="20" y="250" fill="#94a3b8" font-family="system-ui" font-size="11">Trauma Bleeding Protocol Reserves • Cold-lock verified</text>
      <text x="400" y="245" fill="#ffffff" font-family="monospace" font-size="20" font-weight="800">84 Units</text>
    </g>

    <rect x="24" y="380" width="502" height="85" rx="8" fill="#0f2644"/>
    <text x="44" y="415" fill="#38bdf8" font-family="system-ui" font-size="13" font-weight="700">FHIR HL7 COMPLIANT DATABASE SYNCHRONIZATION</text>
    <text x="44" y="435" fill="#94a3b8" font-family="system-ui" font-size="11">Sub-second websocket broadcast across 12 trauma hospital network nodes.</text>
  </g>

  <!-- Right: Donor Dispatch Action Center -->
  <g transform="translate(610, 260)">
    <rect x="0" y="0" width="350" height="490" rx="12" fill="#102035" stroke="#1b3456" stroke-width="1"/>
    <text x="24" y="38" fill="#ffffff" font-family="system-ui" font-size="16" font-weight="700">Emergency SOS Dispatch</text>

    <rect x="24" y="65" width="302" height="150" rx="8" fill="#ef4444" fill-opacity="0.1" stroke="#ef4444" stroke-width="1"/>
    <circle cx="48" cy="95" r="8" fill="#ef4444"/>
    <text x="66" y="100" fill="#f87171" font-family="system-ui" font-size="14" font-weight="700">ACTIVE SOS BROADCAST #89</text>
    <text x="40" y="130" fill="#ffffff" font-family="system-ui" font-size="12">Target: O-Negative Whole Blood</text>
    <text x="40" y="150" fill="#94a3b8" font-family="system-ui" font-size="11">Hospital: St. Jude Memorial Trauma ICU</text>
    <text x="40" y="170" fill="#34d399" font-family="monospace" font-size="12" font-weight="700">4 Donors En Route (ETA: 8 mins)</text>
    <rect x="40" y="185" width="120" height="20" rx="10" fill="#10b981" fill-opacity="0.2"/>
    <text x="55" y="199" fill="#34d399" font-family="monospace" font-size="10">SLOT LOCKED</text>

    <rect x="24" y="235" width="302" height="180" rx="8" fill="#091524" stroke="#162942" stroke-width="1"/>
    <text x="40" y="265" fill="#94a3b8" font-family="system-ui" font-size="12">GEO-HASHING RADIUS STATS</text>
    <text x="40" y="300" fill="#ffffff" font-family="monospace" font-size="28" font-weight="800">15 KM Radius</text>
    <text x="40" y="330" fill="#94a3b8" font-family="system-ui" font-size="11">Eligible Donors Notified: 342</text>
    <text x="40" y="350" fill="#38bdf8" font-family="system-ui" font-size="11">Response Confirmation Rate: 91%</text>
    <text x="40" y="375" fill="#f59e0b" font-family="system-ui" font-size="11">Avg Hospital Arrival: 14 mins</text>
  </g>
</svg>