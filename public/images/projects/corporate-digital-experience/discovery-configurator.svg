<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <defs>
    <linearGradient id="cfgBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a192c"/>
      <stop offset="50%" stop-color="#112744"/>
      <stop offset="100%" stop-color="#0a182b"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="800" fill="url(#cfgBg)"/>

  <!-- Top bar -->
  <rect x="0" y="0" width="1000" height="64" fill="#0d2038"/>
  <text x="40" y="38" fill="#ffffff" font-family="system-ui" font-size="16" font-weight="800">VANGUARD PROJECT DISCOVERY CONFIGURATOR</text>
  <text x="740" y="38" fill="#fbbf24" font-family="monospace" font-size="12">STEP 2 OF 4: SCOPE &amp; TIMELINE</text>

  <!-- Step Bar -->
  <g transform="translate(60, 90)">
    <rect x="0" y="0" width="880" height="650" rx="16" fill="#102540" stroke="#1d3d66" stroke-width="1.5"/>
    
    <text x="40" y="50" fill="#ffffff" font-family="system-ui" font-size="24" font-weight="800">What is the primary deliverable for your enterprise?</text>
    <text x="40" y="80" fill="#94a3b8" font-family="system-ui" font-size="14">Select the digital engineering capabilities required for your upcoming milestone.</text>

    <!-- Option Cards Grid -->
    <g transform="translate(40, 110)">
      <!-- Option 1 (Selected) -->
      <rect x="0" y="0" width="380" height="120" rx="10" fill="#1b3960" stroke="#e0a23c" stroke-width="2"/>
      <circle cx="340" cy="35" r="12" fill="#e0a23c"/>
      <path d="M335 35 L339 39 L346 31" fill="none" stroke="#0a192c" stroke-width="2.5" stroke-linecap="round"/>
      <text x="24" y="38" fill="#ffffff" font-family="system-ui" font-size="16" font-weight="700">Full-Stack SaaS Platform</text>
      <text x="24" y="65" fill="#cbd5e1" font-family="system-ui" font-size="12">React, TypeScript, Node.js / ASP.NET backend with high-density data analytics.</text>
      <text x="24" y="95" fill="#fbbf24" font-family="monospace" font-size="11">8 - 12 Weeks • Production Ready</text>

      <!-- Option 2 -->
      <rect x="420" y="0" width="380" height="120" rx="10" fill="#0d1e34" stroke="#1b385e" stroke-width="1"/>
      <circle cx="760" cy="35" r="12" fill="none" stroke="#64748b" stroke-width="2"/>
      <text x="444" y="38" fill="#ffffff" font-family="system-ui" font-size="16" font-weight="700">AI / ML Recommendation Engine</text>
      <text x="444" y="65" fill="#94a3b8" font-family="system-ui" font-size="12">Vector embedding pipelines, semantic similarity search, and automated real-time reranking.</text>
      <text x="444" y="95" fill="#38bdf8" font-family="monospace" font-size="11">6 - 10 Weeks • Python / FastAPI</text>

      <!-- Option 3 -->
      <rect x="0" y="140" width="380" height="120" rx="10" fill="#0d1e34" stroke="#1b385e" stroke-width="1"/>
      <circle cx="340" cy="175" r="12" fill="none" stroke="#64748b" stroke-width="2"/>
      <text x="24" y="178" fill="#ffffff" font-family="system-ui" font-size="16" font-weight="700">Cybersecurity Training LMS</text>
      <text x="24" y="205" fill="#94a3b8" font-family="system-ui" font-size="12">Interactive phishing sandbox drills, risk heatmaps, and SOC2 audit-ready reporting.</text>
      <text x="24" y="235" fill="#34d399" font-family="monospace" font-size="11">4 - 8 Weeks • Clean Architecture</text>

      <!-- Option 4 -->
      <rect x="420" y="140" width="380" height="120" rx="10" fill="#0d1e34" stroke="#1b385e" stroke-width="1"/>
      <circle cx="760" cy="175" r="12" fill="none" stroke="#64748b" stroke-width="2"/>
      <text x="444" y="178" fill="#ffffff" font-family="system-ui" font-size="16" font-weight="700">Bespoke Brand Web Experience</text>
      <text x="444" y="205" fill="#94a3b8" font-family="system-ui" font-size="12">Award-winning kinetic storytelling, GSAP animations, 60fps responsive choreography.</text>
      <text x="444" y="235" fill="#a78bfa" font-family="monospace" font-size="11">4 - 6 Weeks • High Conversion</text>
    </g>

    <!-- Target Budget Slider -->
    <g transform="translate(40, 410)">
      <text x="0" y="0" fill="#cbd5e1" font-family="system-ui" font-size="14" font-weight="600">Estimated Target Investment Window</text>
      <rect x="0" y="15" width="800" height="8" rx="4" fill="#0b1726"/>
      <rect x="0" y="15" width="480" height="8" rx="4" fill="#e0a23c"/>
      <circle cx="480" cy="19" r="12" fill="#fbbf24" stroke="#0a192c" stroke-width="3"/>
      <text x="430" y="55" fill="#fbbf24" font-family="monospace" font-size="16" font-weight="700">$35,000 - $60,000</text>
    </g>

    <!-- Bottom Actions -->
    <g transform="translate(40, 560)">
      <rect x="0" y="0" width="140" height="44" rx="22" fill="#0d1f35" stroke="#1f3f6b" stroke-width="1"/>
      <text x="45" y="27" fill="#94a3b8" font-family="system-ui" font-size="14" font-weight="600">← Back</text>

      <rect x="620" y="0" width="180" height="44" rx="22" fill="#e0a23c"/>
      <text x="655" y="27" fill="#0a192c" font-family="system-ui" font-size="14" font-weight="800">Continue (Step 3) →</text>
    </g>
  </g>
</svg>