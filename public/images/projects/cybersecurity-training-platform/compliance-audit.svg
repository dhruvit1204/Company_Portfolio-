    <text x="40" y="125" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="600">CC6.1.1</text>
    <text x="160" y="120" fill="#f1f5f9" font-family="system-ui" font-size="13" font-weight="600">Access Control & Role-Based Permissions (RBAC)</text>
