    <rect x="700" y="170" width="70" height="22" rx="4" fill="#10b981" fill-opacity="0.2"/>
    <text x="712" y="185" fill="#34d399" font-family="monospace" font-size="11">PASSED</text>
    <text x="830" y="185" fill="#64748b" font-family="monospace" font-size="12">Oct 10</text>

