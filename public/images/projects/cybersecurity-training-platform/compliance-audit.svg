    <text x="40" y="245" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="600">CC7.1.3</text>
    <text x="160" y="240" fill="#f1f5f9" font-family="system-ui" font-size="13" font-weight="600">Continuous Vulnerability Scanning & Patch Management</text>
    <text x="160" y="256" fill="#94a3b8" font-family="system-ui" font-size="11">Automated SAST/DAST pipelines in GitHub Actions with zero high vulnerabilities</text>
    <text x="560" y="245" fill="#cbd5e1" font-family="system-ui" font-size="12">Platform Lead</text>
    <rect x="700" y="230" width="70" height="22" rx="4" fill="#10b981" fill-opacity="0.2"/>
    <text x="712" y="245" fill="#34d399" font-family="monospace" font-size="11">PASSED</text>
    <text x="830" y="245" fill="#64748b" font-family="monospace" font-size="12">Oct 08</text>

    <!-- Row 4 -->
    <line x1="24" y1="320" x2="896" y2="320" stroke="#172b47" stroke-width="1"/>
    <text x="40" y="305" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="600">CC8.1.1</text>
    <text x="160" y="300" fill="#f1f5f9" font-family="system-ui" font-size="13" font-weight="600">Encrypted Data-at-Rest & In-Transit (TLS 1.3 + AES-256)</text>
    <text x="160" y="316" fill="#94a3b8" font-family="system-ui" font-size="11">PostgreSQL tables partitioned with KMS rotated keys</text>
    <text x="560" y="305" fill="#cbd5e1" font-family="system-ui" font-size="12">Cloud Ops</text>
    <rect x="700" y="290" width="70" height="22" rx="4" fill="#10b981" fill-opacity="0.2"/>
    <text x="712" y="305" fill="#34d399" font-family="monospace" font-size="11">PASSED</text>
    <text x="830" y="305" fill="#64748b" font-family="monospace" font-size="12">Oct 05</text>

    <!-- Export Action Bar -->
    <rect x="24" y="470" width="872" height="46" rx="8" fill="#142c4b"/>
    <text x="44" y="498" fill="#e2e8f0" font-family="system-ui" font-size="13">Official Report: SOC2_Type_II_ExceptionIT_Audit_2025.pdf</text>
    <rect x="720" y="478" width="160" height="30" rx="6" fill="#38bdf8"/>
    <text x="740" y="498" fill="#071326" font-family="system-ui" font-size="12" font-weight="700">EXPORT AUDIT PDF</text>
  </g>
</svg>