    <text x="560" y="125" fill="#cbd5e1" font-family="system-ui" font-size="12">DevSecOps</text>
    <rect x="700" y="110" width="70" height="22" rx="4" fill="#10b981" fill-opacity="0.2"/>
    <text x="712" y="125" fill="#34d399" font-family="monospace" font-size="11">PASSED</text>
    <text x="830" y="125" fill="#64748b" font-family="monospace" font-size="12">Today</text>

    <!-- Row 2 -->
    <line x1="24" y1="200" x2="896" y2="200" stroke="#172b47" stroke-width="1"/>
    <text x="40" y="185" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="600">CC6.6.2</text>
    <text x="160" y="180" fill="#f1f5f9" font-family="system-ui" font-size="13" font-weight="600">Phishing Campaign Simulation & Employee Awareness</text>
    <text x="160" y="196" fill="#94a3b8" font-family="system-ui" font-size="11">Quarterly drills executed with >96% catch rate and remedial modules</text>
