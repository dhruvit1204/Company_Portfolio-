  <circle cx="36" cy="32" r="14" fill="#38bdf8" fill-opacity="0.2"/>
  <path d="M30 32 L34 36 L43 27" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <text x="60" y="38" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">SHIELDOPS AUDIT SUITE</text>
  <rect x="250" y="22" width="100" height="24" rx="12" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="264" y="38" fill="#34d399" font-family="monospace" font-size="11" font-weight="600">SOC2 TYPE II</text>
  <rect x="360" y="22" width="110" height="24" rx="12" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
  <text x="372" y="38" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600">ISO 27001 AUDIT</text>
  <circle cx="940" cy="32" r="16" fill="#1f3654"/>
  <text x="935" y="37" fill="#94a3b8" font-family="system-ui" font-size="12">SJ</text>

  <!-- Metric Badges Row -->
