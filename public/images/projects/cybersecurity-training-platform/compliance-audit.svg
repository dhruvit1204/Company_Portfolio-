    <rect x="0" y="0" width="210" height="90" rx="12" fill="url(#cardGrad)" stroke="#1f3654" stroke-width="1" filter="url(#shadow)"/>
    <text x="20" y="32" fill="#94a3b8" font-family="system-ui" font-size="12">OVERALL COMPLIANCE</text>
    <text x="20" y="66" fill="#10b981" font-family="system-ui" font-size="28" font-weight="800">100.0%</text>
    <text x="120" y="66" fill="#34d399" font-family="monospace" font-size="11">0 Deficiencies</text>

    <!-- Metric 2 -->
    <rect x="235" y="0" width="210" height="90" rx="12" fill="url(#cardGrad)" stroke="#1f3654" stroke-width="1" filter="url(#shadow)"/>
    <text x="255" y="32" fill="#94a3b8" font-family="system-ui" font-size="12">CONTROLS VERIFIED</text>
    <text x="255" y="66" fill="#ffffff" font-family="system-ui" font-size="28" font-weight="800">128 / 128</text>

    <!-- Metric 3 -->
