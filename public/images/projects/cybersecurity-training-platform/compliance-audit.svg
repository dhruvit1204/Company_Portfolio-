    <text x="490" y="32" fill="#94a3b8" font-family="system-ui" font-size="12">EMPLOYEE ATTESTATION</text>
    <text x="490" y="66" fill="#38bdf8" font-family="system-ui" font-size="28" font-weight="800">96.8%</text>

    <!-- Metric 4 -->
