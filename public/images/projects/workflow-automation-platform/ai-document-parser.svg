    <rect x="24" y="60" width="382" height="570" rx="8" fill="#06111f" stroke="#15273e" stroke-width="1"/>
    <g font-family="monospace" font-size="12" xml:space="preserve">
      <text x="44" y="95" fill="#64748b">{</text>
      <text x="64" y="125" fill="#f59e0b">"document_type"</text><text x="195" y="125" fill="#ffffff">: </text><text x="210" y="125" fill="#34d399">"commercial_invoice"</text><text x="375" y="125" fill="#ffffff">,</text>
      <text x="64" y="155" fill="#f59e0b">"invoice_id"</text><text x="160" y="155" fill="#ffffff">: </text><text x="175" y="155" fill="#38bdf8">"INV-4092"</text><text x="255" y="155" fill="#ffffff">,</text>
      <text x="64" y="185" fill="#f59e0b">"vendor"</text><text x="130" y="185" fill="#ffffff">: {</text>
      <text x="84" y="215" fill="#f59e0b">"name"</text><text x="135" y="215" fill="#ffffff">: </text><text x="150" y="215" fill="#34d399">"Silicon Photonics Corp"</text><text x="330" y="215" fill="#ffffff">,</text>
      <text x="84" y="245" fill="#f59e0b">"confidence"</text><text x="180" y="245" fill="#ffffff">: </text><text x="195" y="245" fill="#a78bfa">0.994</text>
      <text x="64" y="275" fill="#ffffff">},</text>
      <text x="64" y="305" fill="#f59e0b">"line_items"</text><text x="160" y="305" fill="#ffffff">: [</text>
      <text x="84" y="335" fill="#ffffff">{ </text><text x="96" y="335" fill="#f59e0b">"sku"</text><text x="130" y="335" fill="#ffffff">: </text><text x="145" y="335" fill="#38bdf8">"QSFP28-100G"</text><text x="250" y="335" fill="#ffffff">, </text><text x="260" y="335" fill="#f59e0b">"qty"</text><text x="295" y="335" fill="#ffffff">: </text><text x="305" y="335" fill="#a78bfa">4</text><text x="320" y="335" fill="#ffffff">, </text><text x="330" y="335" fill="#f59e0b">"amt"</text><text x="365" y="335" fill="#ffffff">: </text><text x="375" y="335" fill="#a78bfa">3800</text><text x="410" y="335" fill="#ffffff"> },</text>
      <text x="84" y="365" fill="#ffffff">{ </text><text x="96" y="365" fill="#f59e0b">"sku"</text><text x="130" y="365" fill="#ffffff">: </text><text x="145" y="365" fill="#38bdf8">"OM4-10M"</text><text x="220" y="365" fill="#ffffff">, </text><text x="230" y="365" fill="#f59e0b">"qty"</text><text x="265" y="365" fill="#ffffff">: </text><text x="275" y="365" fill="#a78bfa">12</text><text x="295" y="365" fill="#ffffff">, </text><text x="305" y="365" fill="#f59e0b">"amt"</text><text x="340" y="365" fill="#ffffff">: </text><text x="350" y="365" fill="#a78bfa">480</text><text x="380" y="365" fill="#ffffff"> }</text>
      <text x="64" y="395" fill="#ffffff">],</text>
      <text x="64" y="425" fill="#f59e0b">"total_usd"</text><text x="150" y="425" fill="#ffffff">: </text><text x="165" y="425" fill="#10b981">4280.00</text><text x="230" y="425" fill="#ffffff">,</text>
      <text x="64" y="455" fill="#f59e0b">"status"</text><text x="130" y="455" fill="#ffffff">: </text><text x="145" y="455" fill="#34d399">"AUTO_APPROVED"</text>
      <text x="44" y="485" fill="#64748b">}</text>
    </g>

    <!-- Webhook Dispatch Badge -->
    <rect x="24" y="570" width="382" height="40" rx="6" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <text x="40" y="595" fill="#34d399" font-family="system-ui" font-size="12" font-weight="600">Dispatched to NetSuite & Slack in 284ms</text>
  </g>
</svg>